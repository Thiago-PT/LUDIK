<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUDIK - Panel Principal</title>
    <link rel="icon" href="img/Ludik2.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- ✅ SOLO ESTAS 3 LÍNEAS SON NECESARIAS PARA EL MENÚ -->
    <link rel="stylesheet" href="Css/Interfaz.css">
    <script src="Js/menu-loader.js" defer></script>
    <script src="Js/Interfaz.js" defer></script>
</head>

<body>

    <!--
        ✅ AQUÍ YA NO VA el <div class="header">, el <div class="overlay">
        ni el <div class="side-menu">. El menú-loader los inyecta solo.
    -->

    <!-- CONTENIDO PROPIO DE ESTA PÁGINA -->
    <div class="content">
        <div class="welcome-section">
            <h1>Bienvenido a LUDIK</h1>
            <p class="subtitle">Plataforma educativa inclusiva para el Colegio San José de Guanentá</p>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon">👥</div>
                    <div class="stat-content">
                        <h3>Estudiantes</h3>
                        <p class="stat-number" id="numEstudiantes">...</p>
                        <p class="stat-desc">Estudiantes activos</p>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-icon">📚</div>
                    <div class="stat-content">
                        <h3>Actividades</h3>
                        <p class="stat-number">+8</p>
                        <p class="stat-desc">Discapacidades con actividades</p>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-icon">🎯</div>
                    <div class="stat-content">
                        <h3>Inclusión</h3>
                        <p class="stat-number">36%</p>
                        <p class="stat-desc">Estudiantes con atención especial en el colegio</p>
                    </div>
                </div>
            </div>

            <div class="quick-actions">
                <h2>Acciones Rápidas</h2>
                <div class="actions-grid" id="accionesRapidas">
                    <!-- Los botones se insertan por JS -->
                </div>
            </div>
        </div>
    </div>

    <!--
        ✅ YA NO VA el <script> inline de DOMContentLoaded que abría
        el menú y verificaba el rol. Interfaz.js lo hace automáticamente.

        ✅ YA NO VA <script src="Js/Roles_menu.js"> si esa lógica
        ya está dentro de Interfaz.js.
    -->

</body>

</html>
